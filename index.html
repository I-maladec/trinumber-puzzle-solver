<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Puzzle sequence solver</title>
</head>
<body>

    <h1>biggest sequence finder</h1>

    <input
        type="file"
        id="fileInput"
        accept=".txt"
    >

    <button id="processButton">
        Find biggest sequence
    </button>

    <br><br>

    <textarea
        id="resultArea"
        rows="10"
        cols="50"
        readonly
        placeholder="Result will appear here..."
    ></textarea>

    <p>Length: <span id="lengthInfo">0</span></p>

    <script src="./main.js"></script>

</body>
</html>
